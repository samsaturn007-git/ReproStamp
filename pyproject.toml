[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reprostamp"
version = "0.1.0"
description = "Compare Git commits using the same independent browser tests"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
prd03 = [
    "alembic==1.20.1",
    "fastapi==0.165.0",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.4",
    "SQLAlchemy==2.1.9",
    "uvicorn==0.54.0",
]

[project.scripts]
reprostamp = "reprostamp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
