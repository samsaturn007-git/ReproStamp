name: Hosted release validation

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12.16'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - name: Confirm checkout and platform
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -sm)" = 'Linux x86_64'
          test "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" = linux/amd64
          git log -1 --format=%H
      - name: Smoke test the pinned runner and provision owned fixtures
        run: |
          ./scripts/setup.sh --all-browsers
          .venv/bin/python scripts/prepare-checkout.py
          .venv/bin/python scripts/prepare_fixture.py shipping
      - name: Install the release package and provision PostgreSQL
        run: |
          .venv/bin/python scripts/setup_prd03.py --release
          .venv/bin/reprostamp --help
          .venv/bin/python -c 'from pathlib import Path; import sys, reprostamp.control; assert Path(reprostamp.control.__file__).is_relative_to(Path(sys.prefix))'
          .venv/bin/python -m reprostamp.control migrate
      - name: Build the production dashboard and record inputs
        run: |
          npm --prefix dashboard run build
          .venv/bin/python -m pip list --format=freeze
          sha256sum requirements/hosted-release.lock dashboard/package-lock.json tools/runner-smoke/package-lock.json
          cat tools/runner-smoke/image.txt
          docker image inspect "$(cat tools/runner-smoke/image.txt)" --format '{{.Os}}/{{.Architecture}} {{.Id}}'
          git diff --exit-code
      - name: Run browser matrix, receipt integrity, and independent replay
        run: .venv/bin/python tests/prd02_exit_gate.py
      - name: Run durable dashboard and worker recovery gate
        run: |
          node tools/runner-smoke/node_modules/@playwright/test/cli.js install --with-deps chromium
          .venv/bin/python tests/prd03_exit_gate.py
      - name: Upload fixture receipts and dashboard recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-release-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .reprostamp/prd02-gates-*/checkout/receipt.zip
            .reprostamp/prd02-gates-*/shipping/receipt.zip
            .reprostamp/prd02-gates-*/replayed/receipt.zip
            .reprostamp/prd03-gates-*/ui-receipt.zip
            .reprostamp/prd03-gates-*/ui-trace.zip
            .reprostamp/prd03-gates-*/browser-timeline.json
